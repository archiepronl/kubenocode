name: Regression Gate

# This CI is intentionally LIGHTWEIGHT.
# Heavy compute (cluster integration, container builds, multi-arch) runs
# on your M2 MacBook via 'make ci-local' BEFORE you push.
# This pipeline is the final safety net — not the primary dev tool.
#
# Gates:
#   1. Format + vet (catches accidental breakage from quick pushes)
#   2. go build ./... (ensures the code at least compiles cleanly)
#   3. Unit tests with race detector (no external services, fast)
#   4. Helm lint (ensures chart templates are valid)
#
# What is NOT here (done locally instead):
#   - Integration tests with testcontainers (run: make test-integration)
#   - Multi-arch container image builds (run: make image)
#   - K3d cluster deployment (run: make dev)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.22"

jobs:
  # ────────────────────────────────────────────────────────────────
  #  Gate: Format · Vet · Build · Unit Tests · Helm
  #  Single job = fast feedback, no queue wait between jobs
  # ────────────────────────────────────────────────────────────────
  gate:
    name: Regression Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # ── 1. Format ─────────────────────────────────────────────────
      - name: Check Go formatting
        run: |
          UNFORMATTED=$(gofmt -l . | grep -v vendor || true)
          if [ -n "$UNFORMATTED" ]; then
            echo "::error::Unformatted Go files detected (run 'make fmt' locally):"
            echo "$UNFORMATTED"
            exit 1
          fi
          echo "✓ All Go files formatted"

      # ── 2. Vet ────────────────────────────────────────────────────
      - name: go vet
        run: |
          go vet ./...
          echo "✓ go vet passed"

      # ── 3. Build ──────────────────────────────────────────────────
      - name: Build all packages
        run: |
          go build ./...
          echo "✓ Build clean"

      # ── 4. Unit tests ─────────────────────────────────────────────
      - name: Unit tests (race detector)
        run: |
          go test -race -count=1 -timeout=120s \
            -coverprofile=coverage.out -covermode=atomic \
            ./core/... ./internal/...

      - name: Coverage threshold (≥ 1%)
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | tr -d '%')
          echo "Total coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < 1" | bc -l) )); then
            echo "::error::Coverage ${COVERAGE}% is below the 1% threshold."
            echo "::error::Run 'make test-unit' locally and add tests before pushing."
            exit 1
          fi
          echo "✓ Coverage ${COVERAGE}% (≥ 1%)"

      # ── 5. Helm lint ──────────────────────────────────────────────
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.2

      - name: Helm lint
        run: |
          CHART_DIR=""
          if   [ -d "deploy/helm/flowengine" ]; then CHART_DIR="deploy/helm/flowengine"
          elif [ -d "deploy/helm/kttm" ];       then CHART_DIR="deploy/helm/kttm"
          fi
          if [ -n "$CHART_DIR" ]; then
            helm lint "$CHART_DIR"
            echo "✓ Helm lint passed"
          else
            echo "No Helm chart found — skipping lint"
          fi

      # ── Summary ───────────────────────────────────────────────────
      - name: Gate summary
        if: always()
        run: |
          echo "::notice::Regression gate complete."
          echo "::notice::For full cluster integration tests, run: make test-integration"
