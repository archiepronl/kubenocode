apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "flowengine.fullname" . }}-api
  labels: { app.kubernetes.io/name: flowengine-api }
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector: { matchLabels: { app.kubernetes.io/name: flowengine-api } }
  template:
    metadata: { labels: { app.kubernetes.io/name: flowengine-api } }
    spec:
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /, port: http }, initialDelaySeconds: 2 }
          livenessProbe: { httpGet: { path: /, port: http }, initialDelaySeconds: 5 }
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "flowengine.fullname" . }}-api
spec:
  selector: { app.kubernetes.io/name: flowengine-api }
  ports: [{ name: http, port: 8080, targetPort: http }]
