apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "flowengine.fullname" . }}-web
  labels: { app.kubernetes.io/name: flowengine-web }
spec:
  replicas: {{ .Values.web.replicaCount }}
  selector: { matchLabels: { app.kubernetes.io/name: flowengine-web } }
  template:
    metadata: { labels: { app.kubernetes.io/name: flowengine-web } }
    spec:
      securityContext: { runAsNonRoot: true, fsGroup: 101, seccompProfile: { type: RuntimeDefault } }
      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: nginx-tmp
          emptyDir: {}
      containers:
        - name: web
          image: "{{ .Values.web.image.repository }}:{{ .Values.web.image.tag }}"
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /, port: http }, initialDelaySeconds: 2 }
          livenessProbe: { httpGet: { path: /, port: http }, initialDelaySeconds: 5 }
          resources: {{- toYaml .Values.web.resources | nindent 12 }}
          volumeMounts:
            - { name: nginx-cache, mountPath: /var/cache/nginx }
            - { name: nginx-run, mountPath: /var/run }
            - { name: nginx-tmp, mountPath: /tmp }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "flowengine.fullname" . }}-web
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: flowengine-web }
  ports: [{ name: http, port: 80, targetPort: http }]
