apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "flowengine.fullname" . }}-web-config
  labels:
    app.kubernetes.io/name: flowengine-web
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;
      root /usr/share/nginx/html;

      location / {
        try_files $uri $uri/ /index.html;
      }

      location /api/ {
        proxy_pass http://{{ include "flowengine.fullname" . }}-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
      }
    }