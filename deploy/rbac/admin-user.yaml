apiVersion: v1
kind: ServiceAccount
metadata:
  name: kttm-admin
  namespace: kttm-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kttm-admin-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: kttm-admin
    namespace: kttm-system
