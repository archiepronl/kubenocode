# GoReleaser configuration
# Generates binaries for all platforms + Changelog on `git tag v*`
# Docs: https://goreleaser.com

version: 2

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - id: kttm-operator
    main: ./cmd/operator/
    binary: kttm-operator
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

  - id: kttm-cli
    main: ./cmd/kttm/
    binary: kttm
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}

archives:
  - id: default
    name_template: "kttm_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip
    files:
      - README.md
      - LICENSE
      - docs/local-dev.md

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  use: github
  groups:
    - title: "🚀 New Features"
      regexp: "^feat"
      order: 0
    - title: "🐛 Bug Fixes"
      regexp: "^fix"
      order: 1
    - title: "📚 Documentation"
      regexp: "^docs"
      order: 2
    - title: "🔧 Other"
      order: 999
  filters:
    exclude:
      - "^chore"
      - "^ci"
      - "merge conflict"
      - "Merge pull request"

release:
  github:
    owner: kubeworkflow
    name: kttm
  draft: false
  prerelease: auto
  name_template: "KTTM {{.Version}}"
  header: |
    ## KTTM {{.Version}}

    Kubernetes-native workflow & no-code platform.

    ### Quick Install
    ```bash
    # macOS (Apple Silicon)
    brew install kubeworkflow/tap/kttm

    # Linux
    curl -sSL https://github.com/kubeworkflow/kttm/releases/latest/download/kttm_linux_amd64.tar.gz | tar xz
    sudo mv kttm /usr/local/bin/

    # Helm
    helm install kttm oci://ghcr.io/kubeworkflow/charts/kttm --version {{.Version}}
    ```
