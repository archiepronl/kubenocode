run:
  timeout: 5m
  allow-parallel-runners: true
  go: "1.22"

# Linters to enable
linters:
  enable:
    - errcheck        # Check error return values
    - gosimple        # Simplifications
    - govet           # go vet equivalents
    - ineffassign     # Unused variable assignments
    - staticcheck     # All staticcheck rules
    - unused          # Unused code
    - gofmt           # Formatting
    - goimports       # Import ordering
    - revive          # General linting + doc rules
    - godot           # Godoc sentences must end with .
    - gocritic        # Various suggestions
    - misspell        # Spell check in comments
    - nilerr          # Returns nil on non-nil error
    - gosec           # Security checks
    - exhaustive      # Switch statement completeness
    - exportloopref   # Loop variable capture
    - bodyclose       # HTTP response body close
    - contextcheck    # Context propagation
    - prealloc        # Slice preallocation suggestions
    - unconvert       # Unnecessary type conversions
    - unparam         # Unused function parameters
    - whitespace      # Whitespace rules

  disable:
    - wsl             # Too strict whitespace rules
    - godox           # We allow TODO for tracking
    - exhaustruct     # Struct initialization — too noisy for now
    - depguard        # Not needed at this stage

linters-settings:
  revive:
    rules:
      - name: exported
        arguments:
          - checkPrivateReceivers
          - sayRepetitiveInsteadOfStutters
      - name: var-naming
      - name: package-comments

  godot:
    scope: declarations     # Exported symbols only
    capital: false

  gocritic:
    enabled-tags:
      - diagnostic
      - style
    disabled-checks:
      - commentFormatting    # Too pedantic

  gosec:
    excludes:
      - G304   # File path from variable — acceptable in our CLI
      - G107   # URL from variable — acceptable in connector URLs

  misspell:
    locale: US

  goimports:
    local-prefixes: github.com/kubeworkflow/kttm,github.com/kubeworkflow/flowengine

issues:
  # Show all issues, not just the first 10
  max-issues-per-linter: 0
  max-same-issues: 0

  exclude-rules:
    # Test files: relax some rules
    - path: "_test.go"
      linters:
        - errcheck
        - gosec
        - unparam
        - exhaustive
    # Generated files: skip everything
    - path: "zz_generated"
      linters:
        - all
    - path: "vendor/"
      linters:
        - all

output:
  format: colored-line-number
  print-issued-lines: true
  print-linter-name: true
  sort-results: true
